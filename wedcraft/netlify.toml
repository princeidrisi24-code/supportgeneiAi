[build]
  command = "npm run build"
  publish = "out"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

[[redirects]]
  from = "/site/*"
  to = "/site/preview/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
