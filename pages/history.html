<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History & Metrics | SupportGenie</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧞</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
    <style>
        .nav-link { text-decoration: none; color: var(--text-secondary); padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: 0.3s; }
        .nav-link:hover { color: var(--text-primary); }
        .nav-link.active { color: var(--text-primary); background: var(--btn-secondary-bg); }
        .chart-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .chart-bar-label { width: 120px; font-size: 0.85rem; color: var(--text-secondary); flex-shrink: 0; }
        .chart-bar-track { flex: 1; height: 28px; background: var(--track-bg); border-radius: 6px; overflow: hidden; }
        .chart-bar-fill { height: 100%; background: linear-gradient(135deg, #00d2ff, #7b2ff7); border-radius: 6px; transition: width 1s ease-out; }
        .chart-bar-value { width: 45px; text-align: right; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Navbar -->
    <nav class="navbar glass-card">
        <div class="container flex-between" style="padding-top:0;padding-bottom:0;height:64px;align-items:center;">
            <a href="dashboard.html" class="logo" style="text-decoration:none;display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.5rem;">🧞‍♂️</span>
                <span class="gradient-text" style="font-size:1.3rem;font-weight:700;">SupportGenie</span>
            </a>
            <div class="nav-links" style="display:flex;gap:8px;align-items:center;">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="new-ticket.html" class="nav-link">New Ticket</a>
                <a href="history.html" class="nav-link active">History</a>
                <button class="theme-toggle-btn" aria-label="Toggle Theme" style="margin-left:8px;">☀️</button>
                <div class="user-menu" style="display:flex;align-items:center;gap:10px;margin-left:8px;">
                    <div class="avatar" id="user-avatar" style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#00d2ff,#7b2ff7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;"></div>
                    <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content container">
        <div class="animate-fade-in-up">
            <div class="flex-between mb-4" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                <h2>History & Metrics</h2>
                <div style="display:flex;gap:10px;">
                    <button id="export-btn" class="btn btn-secondary btn-sm">📥 Export CSV</button>
                    <button id="clear-btn" class="btn btn-danger btn-sm">🗑️ Clear All</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid-4 mb-4">
                <div class="stat-card glass-card-sm"><div class="stat-icon">🎫</div><div class="stat-number gradient-text" id="h-total">0</div><div class="stat-label">Total Tickets</div></div>
                <div class="stat-card glass-card-sm"><div class="stat-icon">⏱️</div><div class="stat-number gradient-text" id="h-time">0m</div><div class="stat-label">Time Saved</div></div>
                <div class="stat-card glass-card-sm"><div class="stat-icon">📊</div><div class="stat-number gradient-text" id="h-top">—</div><div class="stat-label">Top Category</div></div>
                <div class="stat-card glass-card-sm"><div class="stat-icon">🎯</div><div class="stat-number gradient-text" id="h-conf">0%</div><div class="stat-label">Avg Confidence</div></div>
            </div>

            <!-- Category Distribution Chart -->
            <div class="glass-card mb-4">
                <h3 class="mb-3">Category Distribution</h3>
                <div id="category-chart"></div>
            </div>

            <!-- Ticket History List -->
            <div class="glass-card">
                <h3 class="mb-3">All Tickets</h3>
                <div id="tickets-list"></div>
            </div>
        </div>
    </main>

    <footer class="footer" style="padding:20px 0;border-top:1px solid rgba(255,255,255,0.08);margin-top:60px;">
        <div class="container text-center">
            <p class="text-muted" style="font-size:0.85rem;">SupportGenie — AI-Powered Customer Support · Built for Small E-Commerce Teams</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/ai-engine.js"></script>
    <script src="../js/db.js"></script>
    <script>
        // Auth guard
        if (typeof Auth !== 'undefined' && !Auth.requireAuth()) {
            window.location.href = '../login.html';
        }
        
        // Set user avatar
        let user = { name: 'User', id: '1' };
        if (typeof Auth !== 'undefined') user = Auth.getCurrentUser() || user;
        
        if(user && user.name) {
            document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
        }
        
        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await Auth.logout();
        });
        
        // Toast utility
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
    <script>
        (async function() {
            let history = await TicketDB.loadAll();

            function renderHistory() {
                const listEl = document.getElementById('tickets-list');
                const chartEl = document.getElementById('category-chart');
                
                if (history.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state" style="padding:30px;text-align:center;">
                            <div class="icon" style="font-size:2.5rem;">📭</div>
                            <div class="title" style="margin-top:8px;font-weight:600;">No tickets analyzed yet</div>
                            <div class="description text-secondary" style="font-size:0.85rem;margin-bottom:16px;">Go to <a href="new-ticket.html" style="color:#00d2ff;">New Ticket</a> or load sample tickets</div>
                            <button id="h-demo-btn" class="btn btn-secondary btn-sm">⚡ Load 5 Sample Tickets</button>
                        </div>
                    `;
                    chartEl.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="description">Not enough data for chart</div></div>';
                    document.getElementById('h-total').textContent = '0';
                    document.getElementById('h-time').textContent = '0m';
                    document.getElementById('h-top').textContent = '—';
                    document.getElementById('h-conf').textContent = '0%';
                    
                    const btn = document.getElementById('h-demo-btn');
                    if (btn) {
                        btn.addEventListener('click', async () => {
                            showToast('Loading 5 sample tickets...');
                            await TicketDB.loadDemoData();
                            history = await TicketDB.loadAll();
                            renderHistory();
                            showToast('Sample tickets loaded! 🎉');
                        });
                    }
                    return;
                }
                
                let totalTime = 0, confSum = 0, catCounts = {};
                history.forEach(h => {
                    totalTime += (h.timeSaved || 0);
                    confSum += (h.confidence || 0);
                    catCounts[h.category] = (catCounts[h.category] || 0) + 1;
                });
                
                document.getElementById('h-total').textContent = history.length;
                document.getElementById('h-time').textContent = totalTime + 'm';
                document.getElementById('h-conf').textContent = Math.round(confSum / history.length) + '%';
                
                let topCat = '—', maxC = 0;
                for (let [cat, count] of Object.entries(catCounts)) {
                    if (count > maxC) { maxC = count; topCat = cat; }
                }
                document.getElementById('h-top').textContent = topCat;
                
                chartEl.innerHTML = '';
                const sorted = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);
                sorted.forEach(([cat, count]) => {
                    const pct = Math.round((count / history.length) * 100);
                    const row = document.createElement('div');
                    row.className = 'chart-bar-row';
                    row.innerHTML = `
                        <span class="chart-bar-label">${cat}</span>
                        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%"></div></div>
                        <span class="chart-bar-value">${pct}%</span>
                    `;
                    chartEl.appendChild(row);
                });
                
                listEl.innerHTML = '';
                history.forEach((ticket) => {
                    const div = document.createElement('div');
                    div.className = 'glass-card-sm mb-2';
                    div.style.cssText = 'display:grid;grid-template-columns:80px auto 1fr auto auto;align-items:center;gap:12px;padding:14px 16px;';
                    const catClass = 'badge-' + ticket.category.toLowerCase().replace(/[\s\/]/g, '-').replace('return-refund','return');
                    const priClass = 'badge-' + ticket.priority.toLowerCase();
                    div.innerHTML = `
                        <span class="text-muted" style="font-size:0.8rem;">${ticket.date}</span>
                        <span class="badge ${catClass}">${ticket.category}</span>
                        <span style="font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${ticket.snippet}</span>
                        <span class="badge ${priClass}" style="font-size:0.75rem;">${ticket.priority}</span>
                        <span class="text-success" style="font-size:0.8rem;font-weight:500;">⏱️ ${ticket.timeSaved}m</span>
                    `;
                    listEl.appendChild(div);
                });
            }

            renderHistory();

            document.getElementById('export-btn').addEventListener('click', () => {
                if (history.length === 0) { showToast('No data to export.', 'error'); return; }
                let csv = 'Date,Category,Priority,Sentiment,Confidence,Time Saved (min),Customer,Order Number\n';
                history.forEach(h => {
                    csv += `"${h.date}","${h.category}","${h.priority}","${h.sentiment || ''}",${h.confidence},${h.timeSaved},"${h.customerName || ''}","${h.orderNumber || ''}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'supportgenie_export.csv';
                a.click(); URL.revokeObjectURL(url);
                showToast('CSV exported!');
            });

            document.getElementById('clear-btn').addEventListener('click', async () => {
                if (confirm('Are you sure you want to delete all ticket history? This cannot be undone.')) {
                    await TicketDB.clearAll();
                    history = [];
                    renderHistory();
                    showToast('History cleared from database.');
                }
            });
        })();
    </script>
</body>
</html>
