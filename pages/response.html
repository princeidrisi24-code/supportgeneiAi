<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Response | SupportGenie</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧞</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
    <style>
        .nav-link { text-decoration: none; color: var(--text-secondary); padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: 0.3s; }
        .nav-link:hover { color: var(--text-primary); }
        .nav-link.active { color: var(--text-primary); background: var(--btn-secondary-bg); }
        .response-textarea { min-height: 320px; font-size: 1rem; line-height: 1.7; resize: vertical; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Navbar -->
    <nav class="navbar glass-card">
        <div class="container flex-between" style="padding-top:0;padding-bottom:0;height:64px;align-items:center;">
            <a href="dashboard.html" class="logo" style="text-decoration:none;display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.5rem;">🧞‍♂️</span>
                <span class="gradient-text" style="font-size:1.3rem;font-weight:700;">SupportGenie</span>
            </a>
            <div class="nav-links" style="display:flex;gap:8px;align-items:center;">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="new-ticket.html" class="nav-link active">New Ticket</a>
                <a href="history.html" class="nav-link">History</a>
                <button class="theme-toggle-btn" aria-label="Toggle Theme" style="margin-left:8px;">☀️</button>
                <div class="user-menu" style="display:flex;align-items:center;gap:10px;margin-left:8px;">
                    <div class="avatar" id="user-avatar" style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#00d2ff,#7b2ff7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;"></div>
                    <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content container">
        <div class="animate-fade-in-up">
            <div class="mb-3 flex-between" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                <a href="analysis.html" class="btn btn-ghost" style="padding-left:0;">← Back to Analysis</a>
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                    <label for="change-tone-select" class="text-secondary" style="font-size:0.85rem;">Tone:</label>
                    <select id="change-tone-select" class="form-input" style="padding:4px 10px;font-size:0.85rem;width:auto;">
                        <option value="professional">🎩 Professional</option>
                        <option value="friendly">🎭 Friendly</option>
                        <option value="empathetic">💝 Empathetic</option>
                    </select>
                    <span class="badge" style="background:rgba(0,230,118,0.1);color:#00e676;border:1px solid rgba(0,230,118,0.2);" id="time-saved-badge">⏱️ Est. 8 mins saved</span>
                </div>
            </div>

            <div class="glass-card mb-4">
                <div class="flex-between mb-3" style="display:flex;justify-content:space-between;align-items:center;">
                    <h3>✏️ AI-Generated Response</h3>
                    <div class="quality-indicators" style="display:flex;gap:8px;">
                        <span class="badge" style="background:rgba(0,230,118,0.1);color:#00e676;font-size:0.75rem;">✅ Tone Match</span>
                        <span class="badge" style="background:rgba(0,230,118,0.1);color:#00e676;font-size:0.75rem;">✅ Complete</span>
                        <span class="badge" style="background:rgba(0,230,118,0.1);color:#00e676;font-size:0.75rem;">✅ Empathetic</span>
                    </div>
                </div>
                <textarea id="draft-output" class="form-input response-textarea"></textarea>
            </div>

            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button id="copy-btn" class="btn btn-secondary" style="flex:1;min-width:140px;">📋 Copy to Clipboard</button>
                <button id="regenerate-btn" class="btn btn-secondary" style="flex:1;min-width:140px;">🔄 Regenerate</button>
                <button id="save-another-btn" class="btn btn-secondary" style="flex:1;min-width:170px;">✨ Save & New Ticket</button>
                <button id="save-btn" class="btn btn-primary" style="flex:2;min-width:180px;">💾 Save & Complete</button>
            </div>
        </div>
    </main>

    <footer class="footer" style="padding:20px 0;border-top:1px solid rgba(255,255,255,0.08);margin-top:60px;">
        <div class="container text-center">
            <p class="text-muted" style="font-size:0.85rem;">SupportGenie — AI-Powered Customer Support · Built for Small E-Commerce Teams</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/ai-engine.js"></script>
    <script src="../js/db.js"></script>
    <script>
        // Auth guard
        if (typeof Auth !== 'undefined' && !Auth.requireAuth()) {
            window.location.href = '../login.html';
        }
        
        // Set user avatar
        let user = { name: 'User', id: '1' };
        if (typeof Auth !== 'undefined') user = Auth.getCurrentUser() || user;
        
        if(user && user.name) {
            document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
        }
        
        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await Auth.logout();
        });
        
        // Toast utility
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
    <script>
        const analysis = JSON.parse(sessionStorage.getItem('sg_current_analysis'));
        const draft = sessionStorage.getItem('sg_current_draft');
        const tone = sessionStorage.getItem('sg_current_tone') || 'friendly';

        if (!analysis || !draft) { 
            window.location.href = 'new-ticket.html'; 
        } else {
            // Set draft
            document.getElementById('draft-output').value = draft;

            // Set tone selector value
            const toneSelect = document.getElementById('change-tone-select');
            if (toneSelect) toneSelect.value = tone;

            // Tone change event
            if (toneSelect) {
                toneSelect.addEventListener('change', () => {
                    const newTone = toneSelect.value;
                    if (typeof SupportGenieAI !== 'undefined') {
                        const ai = new SupportGenieAI();
                        const newDraft = ai.generateDraft(analysis, user.storeName || 'Our Store', newTone);
                        document.getElementById('draft-output').value = newDraft;
                        sessionStorage.setItem('sg_current_tone', newTone);
                        sessionStorage.setItem('sg_current_draft', newDraft);
                        showToast(`Tone updated to ${newTone.charAt(0).toUpperCase() + newTone.slice(1)}`);
                    }
                });
            }

            // Time saved estimate
            const timeSaved = Math.max(3, Math.floor(analysis.rawText.length / 50));
            document.getElementById('time-saved-badge').textContent = `⏱️ Est. ${timeSaved} mins saved`;

            // Copy with visual button state update
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.addEventListener('click', () => {
                const textToCopy = document.getElementById('draft-output').value;
                navigator.clipboard.writeText(textToCopy)
                    .then(() => {
                        copyBtn.textContent = '✅ Copied!';
                        showToast('Copied to clipboard!');
                        setTimeout(() => { copyBtn.textContent = '📋 Copy to Clipboard'; }, 2000);
                    })
                    .catch(() => {
                        const ta = document.getElementById('draft-output');
                        ta.select();
                        document.execCommand('copy');
                        copyBtn.textContent = '✅ Copied!';
                        showToast('Copied to clipboard!');
                        setTimeout(() => { copyBtn.textContent = '📋 Copy to Clipboard'; }, 2000);
                    });
            });

            // Regenerate
            document.getElementById('regenerate-btn').addEventListener('click', () => {
                const currentSelectedTone = toneSelect ? toneSelect.value : tone;
                if (typeof SupportGenieAI !== 'undefined') {
                    const ai = new SupportGenieAI();
                    const newDraft = ai.generateDraft(analysis, user.storeName || 'Our Store', currentSelectedTone);
                    document.getElementById('draft-output').value = newDraft;
                    sessionStorage.setItem('sg_current_draft', newDraft);
                    showToast('Response regenerated with alternative template');
                }
            });

            // Common Save function
            async function performSave(redirectTo = 'dashboard.html') {
                const currentDraftText = document.getElementById('draft-output').value;
                const selectedTone = toneSelect ? toneSelect.value : tone;

                const ticketPayload = {
                    category:      analysis.category,
                    priority:      analysis.priority,
                    sentiment:     analysis.sentiment,
                    confidence:    analysis.confidence,
                    ticketText:    analysis.rawText || '',
                    draftResponse: currentDraftText,
                    timeSaved:     timeSaved,
                    tone:          selectedTone,
                    snippet:       (analysis.rawText || '').substring(0, 80) + '...',
                    customerName:  analysis.customerName || (analysis.extractedInfo && analysis.extractedInfo.customerName) || '',
                    orderNumber:   analysis.orderNum || analysis.orderNumber || (analysis.extractedInfo && analysis.extractedInfo.orderNumber) || '',
                    date:          new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                };

                await TicketDB.save(ticketPayload);

                // Clear session storage
                sessionStorage.removeItem('sg_current_analysis');
                sessionStorage.removeItem('sg_current_draft');
                sessionStorage.removeItem('sg_current_tone');

                showToast('Ticket saved to database! ✅');
                setTimeout(() => { window.location.href = redirectTo; }, 800);
            }

            // Save & Complete
            const saveBtn = document.getElementById('save-btn');
            saveBtn.addEventListener('click', async () => {
                saveBtn.disabled = true;
                saveBtn.textContent = '⏳ Saving...';
                try {
                    await performSave('dashboard.html');
                } catch (err) {
                    showToast('Error saving ticket: ' + err.message, 'error');
                    saveBtn.disabled = false;
                    saveBtn.textContent = '💾 Save & Complete';
                }
            });

            // Save & New Ticket
            const saveAnotherBtn = document.getElementById('save-another-btn');
            if (saveAnotherBtn) {
                saveAnotherBtn.addEventListener('click', async () => {
                    saveAnotherBtn.disabled = true;
                    saveAnotherBtn.textContent = '⏳ Saving...';
                    try {
                        await performSave('new-ticket.html');
                    } catch (err) {
                        showToast('Error saving ticket: ' + err.message, 'error');
                        saveAnotherBtn.disabled = false;
                        saveAnotherBtn.textContent = '✨ Save & New Ticket';
                    }
                });
            }
        }
    </script>
</body>
</html>
