<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Response | </title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23753FC9'/><text x='50%' y='65%' font-size='50' font-weight='bold' text-anchor='middle' fill='white'>SG</text></svg>">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
    <style>
        .response-textarea {
            min-height: 320px;
            font-size: 1rem;
            line-height: 1.7;
            resize: vertical;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: var(--primary);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .warning-box {
            background: var(--warning-bg);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <div id="toast-container" class="toast-container"></div>

        <!-- Navbar -->
        <nav class="navbar">
            <div class="container flex-between" style="height:64px; align-items:center;">
                <a href="dashboard.html" class="logo">
                    <svg class="logo-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                    <span class="brand-text" style="font-size:1.25rem;"></span>
                </a>
                <div class="nav-links">
                    <a href="dashboard.html" class="nav-item">Dashboard</a>
                    <a href="new-ticket.html" class="nav-item active">New Ticket</a>
                    <a href="history.html" class="nav-item">History</a>
                    <button class="theme-toggle-btn" aria-label="Toggle Theme">Dark Theme</button>
                    <div class="user-menu" style="display:flex;align-items:center;gap:10px;margin-left:8px;">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="main-content container" style="margin-top: 2rem;">
            <div class="animate-fade-in-up">
                <div class="mb-3 flex-between" style="flex-wrap:wrap; gap:12px;">
                    <a href="analysis.html" class="btn btn-ghost btn-sm" style="text-decoration: none;">&larr; Back to
                        Analysis</a>
                    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                        <label for="change-tone-select" class="text-secondary"
                            style="font-size: 14px; font-weight: 500;">Tone:</label>
                        <select id="change-tone-select" class="form-input"
                            style="padding:4px 10px; font-size:14px; width:auto; height: 36px;">
                            <option value="professional">Professional</option>
                            <option value="friendly">Friendly</option>
                            <option value="empathetic">Empathetic</option>
                        </select>
                        <span class="badge badge-green" id="time-saved-badge">Est. 8 mins saved</span>
                    </div>
                </div>

                <!-- Verification Warning Banner -->
                <div id="agent-warning-banner" class="warning-box hidden">
                    <strong>Human Review Required:</strong> Please review and verify all details in the response before
                    sending to the customer.
                </div>

                <div class="card mb-4" style="padding: 1.5rem;">
                    <div class="flex-between mb-3" style="flex-wrap: wrap; gap: 8px;">
                        <h3>AI-Generated Response</h3>
                        <div class="quality-indicators" style="display:flex; gap:8px;">
                            <span class="badge badge-green">Safe Draft</span>
                            <span class="badge badge-purple" id="tone-badge">Friendly</span>
                        </div>
                    </div>
                    <textarea id="draft-output" class="form-input response-textarea"></textarea>
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <button id="copy-btn" class="btn btn-secondary" style="flex:1; min-width:140px;">Copy to
                        Clipboard</button>
                    <button id="regenerate-btn" class="btn btn-secondary"
                        style="flex:1; min-width:140px;">Regenerate</button>
                    <button id="save-another-btn" class="btn btn-secondary" style="flex:1; min-width:170px;">Save & New
                        Ticket</button>
                    <button id="save-btn" class="btn btn-primary" style="flex:2; min-width:180px;">Save &
                        Complete</button>
                </div>
            </div>
        </main>

        <footer
            style="padding: 24px 0; border-top: 1px solid var(--card-border); margin-top: auto; background: var(--surface);">
            <div class="container text-center">
                <p class="text-muted" style="font-size:14px;"> — Customer Support Ticket System for E-Commerce Teams</p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/ai-engine.js"></script>
    <script src="../js/db.js"></script>
    <script>
        if (typeof Auth !== 'undefined' && !Auth.requireAuth()) {
            window.location.href = '../login.html';
        }
        
        let user = { name: 'User', id: '1' };
        if (typeof Auth !== 'undefined') user = Auth.getCurrentUser() || user;
        
        if(user && user.name) {
            document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
        }
        
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await Auth.logout();
        });
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.style.cssText = 'padding:12px 20px; background:var(--primary); color:#fff; border-radius:8px; margin-top:8px; font-size:14px;';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
    <script>
        const analysis = JSON.parse(sessionStorage.getItem('sg_current_analysis'));
        const draft = sessionStorage.getItem('sg_current_draft');
        const tone = sessionStorage.getItem('sg_current_tone') || 'friendly';

        if (!analysis || !draft) {
            window.location.href = 'new-ticket.html';
        } else {
            document.getElementById('draft-output').value = draft;

            const toneSelect = document.getElementById('change-tone-select');
            const toneBadge = document.getElementById('tone-badge');
            if (toneSelect) toneSelect.value = tone;
            if (toneBadge) toneBadge.textContent = tone.charAt(0).toUpperCase() + tone.slice(1);

            if (analysis.needsHumanReview) {
                document.getElementById('agent-warning-banner').classList.remove('hidden');
            }

            if (toneSelect) {
                toneSelect.addEventListener('change', () => {
                    const newTone = toneSelect.value;
                    if (typeof AI !== 'undefined') {
                        const ai = new AI();
                        const newDraft = ai.generateDraft(analysis, user.storeName || 'Our Store', newTone);
                        document.getElementById('draft-output').value = newDraft;
                        sessionStorage.setItem('sg_current_tone', newTone);
                        sessionStorage.setItem('sg_current_draft', newDraft);
                        if (toneBadge) toneBadge.textContent = newTone.charAt(0).toUpperCase() + newTone.slice(1);
                        showToast(`Tone updated to ${newTone.charAt(0).toUpperCase() + newTone.slice(1)}`);
                    }
                });
            }

            const aiEngine = (typeof AI !== 'undefined') ? new AI() : null;
            const timeSaved = analysis.timeSaved || (aiEngine ? aiEngine.calculateTimeSaved(analysis) : Math.max(3, Math.floor((analysis.rawText || '').length / 50)));
            document.getElementById('time-saved-badge').textContent = `Est. ${timeSaved} mins saved`;

            const copyBtn = document.getElementById('copy-btn');
            copyBtn.addEventListener('click', () => {
                const textToCopy = document.getElementById('draft-output').value;
                navigator.clipboard.writeText(textToCopy)
                    .then(() => {
                        copyBtn.textContent = 'Copied!';
                        showToast('Copied to clipboard!');
                        setTimeout(() => { copyBtn.textContent = 'Copy to Clipboard'; }, 2000);
                    })
                    .catch(() => {
                        const ta = document.getElementById('draft-output');
                        ta.select();
                        document.execCommand('copy');
                        copyBtn.textContent = 'Copied!';
                        showToast('Copied to clipboard!');
                        setTimeout(() => { copyBtn.textContent = 'Copy to Clipboard'; }, 2000);
                    });
            });

            document.getElementById('regenerate-btn').addEventListener('click', () => {
                const currentSelectedTone = toneSelect ? toneSelect.value : tone;
                if (typeof AI !== 'undefined') {
                    const ai = new AI();
                    const newDraft = ai.generateDraft(analysis, user.storeName || 'Our Store', currentSelectedTone);
                    document.getElementById('draft-output').value = newDraft;
                    sessionStorage.setItem('sg_current_draft', newDraft);
                    showToast('Response regenerated with safe template');
                }
            });

            async function performSave(redirectTo = 'dashboard.html', targetStatus = 'Resolved') {
                const currentDraftText = document.getElementById('draft-output').value;
                const selectedTone = toneSelect ? toneSelect.value : tone;

                const ticketPayload = {
                    id: analysis.id || undefined,
                    category: analysis.category,
                    secondaryCategory: analysis.secondaryCategory || null,
                    priority: analysis.priority,
                    priorityReason: analysis.priorityReason || '',
                    sentiment: analysis.sentiment,
                    confidence: analysis.confidence,
                    status: targetStatus,
                    ticketText: analysis.rawText || '',
                    draftResponse: currentDraftText,
                    timeSaved: timeSaved,
                    tone: selectedTone,
                    snippet: (analysis.rawText || '').substring(0, 80) + '...',
                    customerName: analysis.customerName || (analysis.extractedInfo && analysis.extractedInfo.customerName) || '',
                    orderNumber: analysis.orderNum || analysis.orderNumber || (analysis.extractedInfo && analysis.extractedInfo.orderNumber) || '',
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                };

                await TicketDB.save(ticketPayload);

                sessionStorage.removeItem('sg_current_analysis');
                sessionStorage.removeItem('sg_current_draft');
                sessionStorage.removeItem('sg_current_tone');

                showToast('Ticket completed & saved to database!');
                setTimeout(() => { window.location.href = redirectTo; }, 600);
            }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.addEventListener('click', async () => {
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';
                try {
                    await performSave('dashboard.html', 'Resolved');
                } catch (err) {
                    showToast('Error saving ticket: ' + err.message, 'error');
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save & Complete';
                }
            });

            const saveAnotherBtn = document.getElementById('save-another-btn');
            if (saveAnotherBtn) {
                saveAnotherBtn.addEventListener('click', async () => {
                    saveAnotherBtn.disabled = true;
                    saveAnotherBtn.textContent = 'Saving...';
                    try {
                        await performSave('new-ticket.html', 'Resolved');
                    } catch (err) {
                        showToast('Error saving ticket: ' + err.message, 'error');
                        saveAnotherBtn.disabled = false;
                        saveAnotherBtn.textContent = 'Save & New Ticket';
                    }
                });
            }
        }
    </script>
</body>

</html>
