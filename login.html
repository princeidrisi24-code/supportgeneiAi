<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - </title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23753FC9'/><text x='50%' y='65%' font-size='50' font-weight='bold' text-anchor='middle' fill='white'>SG</text></svg>">
  <script src="js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <style>
    .auth-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 64px);
      padding: 2rem;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--primary);
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <nav class="navbar">
      <div class="container flex-between" style="height:64px; align-items:center;">
        <a href="index.html" class="logo">
          <svg class="logo-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
          <span class="brand-text" style="font-size:1.25rem;"></span>
        </a>
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="theme-toggle-btn" aria-label="Toggle Theme">Dark Theme</button>
        </div>
      </div>
    </nav>

    <main class="auth-page main-content">
      <div class="auth-card animate-fade-in-up">
        <div class="logo-section text-center mb-4">
          <div style="margin-bottom: 12px; display: flex; justify-content: center;">
            <svg class="logo-icon-svg" style="width: 48px; height: 48px;" viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>
          </div>
          <h2>Welcome Back</h2>
          <p class="text-secondary mb-2">Sign in to your account</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required
              autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div style="position: relative;">
              <input type="password" id="password" class="form-input w-full" placeholder="Enter your password" required
                autocomplete="current-password" style="padding-right: 60px;">
              <button type="button" id="toggle-password" class="password-toggle"
                aria-label="Toggle password visibility">Show</button>
            </div>
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
            <span class="btn-text">Sign In</span>
            <span class="spinner hidden">Loading...</span>
          </button>

          <div style="margin-top: 16px; text-align: center;">
            <button type="button" id="demo-login-btn" class="btn btn-secondary btn-block">Instant Demo Login</button>
          </div>
        </form>

        <div class="auth-footer text-center mt-4">
          <p class="text-secondary">Don't have an account? <a href="signup.html"
              style="color: var(--primary); text-decoration:none; font-weight:600;">Create one</a></p>
        </div>
      </div>
    </main>

    <footer
      style="padding: 24px 0; border-top: 1px solid var(--card-border); margin-top: auto; background: var(--surface);">
      <div class="container text-center">
        <p class="text-muted" style="font-size:14px;"> — Customer Support Ticket System for E-Commerce Teams</p>
      </div>
    </footer>
  </div>

  <script>
  Auth.redirectIfLoggedIn();
  
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');
    const btn = e.target.querySelector('button[type="submit"]');
    const btnText = btn.querySelector('.btn-text');
    const spinner = btn.querySelector('.spinner');
    
    btnText.classList.add('hidden');
    spinner.classList.remove('hidden');
    btn.disabled = true;
    errorEl.classList.add('hidden');
    
    try {
      const result = await Auth.login(email, password);
      if (result.success) {
        window.location.href = 'pages/dashboard.html';
      } else {
        errorEl.textContent = result.error;
        errorEl.classList.remove('hidden');
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
        btn.disabled = false;
      }
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please try again.';
      errorEl.classList.remove('hidden');
      btnText.classList.remove('hidden');
      spinner.classList.add('hidden');
      btn.disabled = false;
    }
  });

  document.getElementById('demo-login-btn').addEventListener('click', function() {
    Auth.demoLogin();
  });

  document.getElementById('toggle-password').addEventListener('click', function() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.textContent = pw.type === 'password' ? 'Show' : 'Hide';
  });
  </script>
</body>

</html>
