<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SupportGenie</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧞</text></svg>">
  <script src="js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .auth-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 64px);
      padding: 2rem;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      border-radius: 16px;
      box-sizing: border-box;
    }
    .auth-card h2 {
      padding-top: 0;
      margin-bottom: 0.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.2);
      color: inherit;
      font-family: inherit;
      box-sizing: border-box;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0;
      color: inherit;
    }
    .form-error {
      color: var(--error, #ff1744);
      font-size: 0.85rem;
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(255, 23, 68, 0.1);
      border-radius: 6px;
    }
    .hidden {
      display: none !important;
    }
    .w-full {
      width: 100%;
    }
    .btn-block {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .text-center { text-align: center; }
    .mb-4 { margin-bottom: 1.5rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-4 { margin-top: 1.5rem; }
    .text-secondary { color: #888; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
<div class="page-wrapper">
  <nav class="navbar glass-card">
    <div class="container flex-between" style="padding-top:0;padding-bottom:0;height:64px;align-items:center;">
      <a href="index.html" class="logo" style="text-decoration:none;">
        <span class="genie-icon">🧞‍♂️</span>
        <h1 style="font-size:1.3rem; margin:0;" class="gradient-text">SupportGenie</h1>
      </a>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="theme-toggle-btn" aria-label="Toggle Theme">☀️</button>
      </div>
    </div>
  </nav>

  <main class="auth-page main-content">
    <div class="auth-card glass-card animate-fade-in-up">
      <div class="logo-section text-center mb-4">
        <div style="font-size: 3rem; margin-bottom: 8px;">🧞‍♂️</div>
        <h2>Welcome Back</h2>
        <p class="subtitle text-secondary">Sign in to your SupportGenie account</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-input w-full" placeholder="Enter your password" required autocomplete="current-password" style="padding-right: 40px;">
            <button type="button" id="toggle-password" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
          <span class="btn-text">Sign In</span>
          <span class="spinner hidden"></span>
        </button>

        <div style="margin-top: 16px; text-align: center;">
          <button type="button" id="demo-login-btn" class="btn btn-secondary btn-block">⚡ Instant Demo Login</button>
        </div>
      </form>

      <div class="auth-footer text-center mt-4">
        <p class="text-secondary">Don't have an account? <a href="signup.html" class="gradient-text" style="text-decoration:none; font-weight:600;">Create one</a></p>
      </div>
    </div>
  </main>
</div>

<script>
  Auth.redirectIfLoggedIn();
  
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');
    const btn = e.target.querySelector('button[type="submit"]');
    const btnText = btn.querySelector('.btn-text');
    const spinner = btn.querySelector('.spinner');
    
    btnText.classList.add('hidden');
    spinner.classList.remove('hidden');
    btn.disabled = true;
    errorEl.classList.add('hidden');
    
    try {
      const result = await Auth.login(email, password);
      if (result.success) {
        window.location.href = 'pages/dashboard.html';
      } else {
        errorEl.textContent = result.error;
        errorEl.classList.remove('hidden');
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
        btn.disabled = false;
      }
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please try again.';
      errorEl.classList.remove('hidden');
      btnText.classList.remove('hidden');
      spinner.classList.add('hidden');
      btn.disabled = false;
    }
  });

  document.getElementById('demo-login-btn').addEventListener('click', function() {
    Auth.demoLogin();
  });

  document.getElementById('toggle-password').addEventListener('click', function() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.textContent = pw.type === 'password' ? '👁️' : '🙈';
  });
</script>
</body>
</html>
